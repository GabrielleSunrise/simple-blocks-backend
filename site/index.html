<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabrielle Sunrise</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0f1115; color:#e8e8ea; font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
         text-align:center; padding:24px; }
  .card { max-width:560px; }
  h1 { font-size:2.2rem; margin:0 0 10px; }
  p { color:#9aa0aa; line-height:1.6; margin:0 0 8px; }
  a.btn { display:inline-block; margin-top:22px; padding:12px 22px; border:1px solid #3a3f4a;
          border-radius:10px; color:#e8e8ea; text-decoration:none; transition:background .15s; }
  a.btn:hover { background:#1a1d24; }
  small { display:block; margin-top:34px; color:#5b6270; }
</style>
</head>
<body>
  <main class="card">
    <h1>Gabrielle Sunrise</h1>
    <p>Личная страница в разработке.</p>
    <p>Здесь появятся сведения обо мне и ссылки на проекты.</p>
    <a class="btn" href="https://gabriellesunrise.github.io/simple-blocks-with-auth/">Simple Blocks — генератор блоков для сайтов</a>
    <small>© <span id="y"></span> Gabrielle Sunrise</small>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
